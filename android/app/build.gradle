plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    keystoreProperties.getProperty(it)?.trim()
}

android {
    namespace "com.openrbt.mobile_wash_control"
    compileSdkVersion 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.openrbt.mobile_wash_control"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion 24
        multiDexEnabled true
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // key.properties holds the upload key and is never committed. Without it the
            // release build falls back to the debug key so `flutter run --release` works.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    // An app bundle is only ever built to be uploaded, and Google Play rejects anything
    // signed with the debug key. Fail the build here instead of producing an .aab that is
    // refused on upload.
    if (!hasReleaseSigning) {
        gradle.taskGraph.whenReady { graph ->
            def uploadTask = graph.allTasks.find { it.name ==~ /(?i).*bundle.*release.*/ }
            if (uploadTask != null) {
                throw new GradleException(
                    "android/key.properties is missing, so this bundle would be signed with the " +
                    "Android debug key and Google Play would reject it. Copy " +
                    "android/key.properties.sample to android/key.properties and point storeFile " +
                    "at the release keystore."
                )
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Nothing here for now. Firebase was removed: no Dart code uses it, there is no
    // google-services.json, and firebase-auth only added exported deep-link activities.
    // multidex needs no artifact either - it is native from minSdk 21 and
    // multiDexEnabled is already set in defaultConfig.
}
