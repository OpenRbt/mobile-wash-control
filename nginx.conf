server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets {
        try_files $uri =404;
    }

    location ~* \.(otf|ttf|woff|woff2)$ {
        add_header Cache-Control "max-age=300";
        try_files $uri =404;
    }
}
